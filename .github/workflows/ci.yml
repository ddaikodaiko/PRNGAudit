name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones fijadas en uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tipos
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  slow:
    name: Pruebas lentas (exhaustivas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: untemper sobre los 2^32 valores posibles
        run: uv run pytest -m slow

  vectors:
    name: Vectores de referencia (JDK, V8, C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          # El perfil "v8-cache" de Math.random() se validó con Node 22 (V8 12.4).
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Regenerar y comparar con los vectores versionados
        run: make vectors-check
